        fill="#FFFFFF" letter-spacing="1">fLaC</text>
  <text x="110" y="150" text-anchor="middle"
        font-family="Verdana, Geneva, sans-serif" font-size="13"
        fill="#FFFFFF" letter-spacing="3">LOSSLESS</text>
