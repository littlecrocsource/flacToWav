<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <!-- FLAC: vintage marquee channel letters, transparent-glass bulbs with visible
       filaments. Defective bulbs run a 12s two-phase cycle: set A dies in the first
       6s loop, set B in the second, so the dead bulbs rotate positions.
       Arrow: neon, 3000K warm -> green, current pulse flowing left to right.
       WAV: steady neon sign. Transparent background, no blur filters. -->
  <defs>
    <radialGradient id="warmPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB84D" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#FF9A2E" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FF9A2E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenPool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2EE065" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#2EE065" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2EE065" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="534" y1="0" x2="584" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB84D"/>
      <stop offset="0.5" stop-color="#FFD24D"/>
      <stop offset="1" stop-color="#2EE065"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#C7A053"/>
      <stop offset="0.45" stop-color="#9C7638"/>
      <stop offset="1" stop-color="#6E4E22"/>
    </linearGradient>
    <radialGradient id="bulbHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9A8" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFC964" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFC964" stop-opacity="0"/>
    </radialGradient>

    <g id="bulb">
      <circle r="13" fill="url(#bulbHalo)"/>
      <circle r="7" fill="#FFD98C" fill-opacity="0.30" stroke="#D9B269" stroke-opacity="0.6" stroke-width="1"/>
      <path d="M-3.4 2.6 L-1.7 -2.4 L0 2.2 L1.7 -2.6 L3.4 2.4" fill="none" stroke="#FF9E2E" stroke-width="1.9" stroke-linecap="round" opacity="0.9"/>
      <path d="M-3.4 2.6 L-1.7 -2.4 L0 2.2 L1.7 -2.6 L3.4 2.4" fill="none" stroke="#FFF6D8" stroke-width="0.9" stroke-linecap="round"/>
      <path d="M-3 4.2 h6" stroke="#8A6B35" stroke-width="1.1" opacity="0.6"/>
      <circle cx="-2.4" cy="-2.8" r="1.3" fill="#FFFFFF" fill-opacity="0.85"/>
    </g>
    <g id="bulbDead">
      <circle r="7" fill="#241E16" fill-opacity="0.88" stroke="#3A322A" stroke-width="1"/>
      <path d="M-3.4 2.6 L-1.7 -2.4 L0 2.2 L1.7 -2.6 L3.4 2.4" fill="none" stroke="#4A3F33" stroke-width="1" stroke-linecap="round"/>
      <path d="M-3 4.2 h6" stroke="#3A322A" stroke-width="1.1"/>
      <circle cx="-2.4" cy="-2.8" r="1.2" fill="#FFFFFF" fill-opacity="0.12"/>
    </g>

    <g id="lettersFLAC" fill="none" stroke-linecap="square" stroke-linejoin="miter" stroke-miterlimit="3">
      <path d="M70 200 V60 H130 M70 130 H118"/>
      <path d="M180 60 V200 H240"/>
      <path d="M286 200 L322 64 H338 L374 200 M302 152 H358"/>
      <path d="M498 90 A42 68 0 1 0 498 170"/>
    </g>

    <path id="arrowP" d="M534 140 H560 M550 120 L584 140 L550 160"/>
    <path id="wW" d="M652 82 L678 182 L700 118 L722 182 L748 82"/>
    <path id="wA" d="M790 182 L820 82 L850 182 M801 149 H839"/>
    <path id="wV" d="M892 82 L922 182 L952 82"/>
  </defs>

  <!-- ambient light pools -->
  <ellipse cx="280" cy="130" rx="265" ry="118" fill="url(#warmPool)">
    <animate attributeName="opacity" values="1;0.86;1;0.75;1;0.92;1" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="915" cy="130" rx="235" ry="110" fill="url(#greenPool)"/>

  <!-- ===================== FLAC marquee letters ===================== -->
  <use href="#lettersFLAC" stroke="#0F0C09" stroke-width="40"/>
  <use href="#lettersFLAC" stroke="url(#face)" stroke-width="32"/>
  <use href="#lettersFLAC" stroke="#000000" stroke-opacity="0.14" stroke-width="20"/>
  <!-- A counter (enclosed channel interior) -->
  <path d="M330 102 L315 138 H345 Z" fill="#191512" stroke="#0F0C09" stroke-width="3"/>
  <!-- weathering streaks -->
  <g fill="none" stroke="#6E4A22" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
    <path d="M84 74 v 22"/><path d="M196 150 v 26"/><path d="M352 92 v 16"/><path d="M440 184 q 6 6 14 8"/>
  </g>

  <!-- dead-bulb underlays: visible whenever the lit bulb above fades out -->
  <g>
    <use href="#bulbDead" x="70" y="115"/><use href="#bulbDead" x="70" y="142"/>
    <use href="#bulbDead" x="180" y="90"/><use href="#bulbDead" x="237" y="197"/>
    <use href="#bulbDead" x="356" y="130"/><use href="#bulbDead" x="365" y="164"/>
    <use href="#bulbDead" x="464" y="62"/><use href="#bulbDead" x="443" y="189"/>
  </g>

  <!-- healthy bulbs, gentle group breathing -->
  <g>
    <animate attributeName="opacity" values="1;0.92;1;0.85;1;0.95;1" dur="3.4s" repeatCount="indefinite"/>
    <!-- F -->
    <use href="#bulb" x="70" y="196"/><use href="#bulb" x="70" y="169"/>
    <use href="#bulb" x="70" y="88"/><use href="#bulb" x="70" y="63"/>
    <use href="#bulb" x="99" y="63"/><use href="#bulb" x="127" y="63"/>
    <use href="#bulb" x="96" y="130"/><use href="#bulb" x="117" y="130"/>
    <!-- L -->
    <use href="#bulb" x="180" y="63"/><use href="#bulb" x="180" y="117"/>
    <use href="#bulb" x="180" y="144"/><use href="#bulb" x="180" y="171"/><use href="#bulb" x="180" y="197"/>
    <use href="#bulb" x="209" y="197"/>
    <!-- A -->
    <use href="#bulb" x="330" y="64"/>
    <use href="#bulb" x="314" y="96"/><use href="#bulb" x="305" y="130"/><use href="#bulb" x="296" y="164"/><use href="#bulb" x="287" y="197"/>
    <use href="#bulb" x="347" y="96"/><use href="#bulb" x="374" y="197"/>
    <use href="#bulb" x="318" y="152"/><use href="#bulb" x="342" y="152"/>
    <!-- C -->
    <use href="#bulb" x="498" y="90"/><use href="#bulb" x="485" y="71"/>
    <use href="#bulb" x="423" y="71"/><use href="#bulb" x="428" y="96"/><use href="#bulb" x="422" y="130"/>
    <use href="#bulb" x="428" y="164"/><use href="#bulb" x="464" y="198"/>
    <use href="#bulb" x="485" y="189"/><use href="#bulb" x="498" y="170"/>
  </g>

  <!-- defective bulbs: 12s cycle = two 6s loops; set A fails in loop 1, set B in loop 2 -->
  <g>
    <!-- F: adjacent pair on the stem, buzzing style, set A -->
    <use href="#bulb" x="70" y="115">
      <animate attributeName="opacity" values="1;0.2;0.85;0.1;0.6;0;0.05;0;0.9;1;1" keyTimes="0;0.04;0.08;0.13;0.18;0.25;0.32;0.42;0.5;0.55;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <use href="#bulb" x="70" y="142">
      <animate attributeName="opacity" values="1;0.9;0.15;0.7;0;0.4;0;0.85;1;1" keyTimes="0;0.05;0.1;0.15;0.22;0.3;0.4;0.5;0.56;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <!-- L: staggered pair, strobe style, set B -->
    <use href="#bulb" x="180" y="90">
      <animate attributeName="opacity" values="1;1;0;1;0;1;0;0;1;1" keyTimes="0;0.5;0.54;0.58;0.62;0.66;0.72;0.86;0.94;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <use href="#bulb" x="237" y="197">
      <animate attributeName="opacity" values="1;1;0.1;0.9;0;0.7;0;0.95;1" keyTimes="0;0.52;0.57;0.63;0.7;0.78;0.86;0.95;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <!-- A: adjacent pair on the right leg, slow-fade style, set A -->
    <use href="#bulb" x="356" y="130">
      <animate attributeName="opacity" values="1;0.6;0.8;0.3;0.5;0.05;0;0.7;1;1" keyTimes="0;0.08;0.14;0.22;0.28;0.36;0.44;0.5;0.58;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <use href="#bulb" x="365" y="164">
      <animate attributeName="opacity" values="1;0.7;0.9;0.4;0.1;0;0.8;1;1" keyTimes="0;0.1;0.16;0.24;0.34;0.44;0.52;0.6;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <!-- C: staggered pair, buzz style, set B -->
    <use href="#bulb" x="464" y="62">
      <animate attributeName="opacity" values="1;1;0.25;0.9;0.1;0.6;0;0.05;0.9;1" keyTimes="0;0.5;0.55;0.6;0.66;0.72;0.8;0.88;0.96;1" dur="12s" repeatCount="indefinite"/>
    </use>
    <use href="#bulb" x="443" y="189">
      <animate attributeName="opacity" values="1;1;0.8;0.2;0.7;0;0.3;0;0.95;1" keyTimes="0;0.52;0.58;0.64;0.7;0.78;0.85;0.9;0.97;1" dur="12s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ===================== neon arrow ===================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#arrowP" stroke="url(#flow)" stroke-opacity="0.25" stroke-width="16"/>
    <use href="#arrowP" stroke="url(#flow)" stroke-width="7"/>
    <use href="#arrowP" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.4" stroke-dasharray="10 60">
      <animate attributeName="stroke-dashoffset" from="70" to="0" dur="0.9s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- ===================== WAV neon sign ===================== -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <rect x="592" y="34" width="560" height="196" rx="34" stroke="#0FA84A" stroke-opacity="0.25" stroke-width="12"/>
      <rect x="592" y="34" width="560" height="196" rx="34" stroke="#1FBF57" stroke-opacity="0.85" stroke-width="4.5"/>
      <rect x="592" y="34" width="560" height="196" rx="34" stroke="#C9F7D6" stroke-opacity="0.9" stroke-width="1.4"/>
    </g>
    <g fill="#26221C" stroke="#0B0906" stroke-width="1">
      <circle cx="872" cy="34" r="4.5"/><circle cx="872" cy="230" r="4.5"/>
      <circle cx="592" cy="132" r="4.5"/><circle cx="1152" cy="132" r="4.5"/>
    </g>
    <g stroke="#0FA84A" stroke-opacity="0.28" stroke-width="20">
      <use href="#wW"/><use href="#wA"/><use href="#wV"/>
    </g>
    <g stroke="#2EE065" stroke-width="8">
      <use href="#wW"/><use href="#wA"/><use href="#wV"/>
    </g>
    <g stroke="#9FF7BB" stroke-width="3.2">
      <use href="#wW"/><use href="#wA"/><use href="#wV"/>
    </g>
    <g stroke="#F0FFF4" stroke-width="1.2">
      <use href="#wW"/><use href="#wA"/><use href="#wV"/>
    </g>
    <g fill="#1A2E20" stroke="none">
      <circle cx="652" cy="82" r="3.2"/><circle cx="748" cy="82" r="3.2"/>
      <circle cx="790" cy="182" r="3.2"/><circle cx="850" cy="182" r="3.2"/>
      <circle cx="892" cy="82" r="3.2"/><circle cx="952" cy="82" r="3.2"/>
    </g>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" letter-spacing="3" stroke="none">
      <text x="988" y="140" fill="#2EE065" fill-opacity="0.75">16bit</text>
      <text x="988" y="164" fill="#2EE065" fill-opacity="0.55">44.1k</text>
    </g>
  </g>
</svg>
